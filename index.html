<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI FaceID Ultimate - Professional Version</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
    <style>
        :root { 
            --primary: #00f2fe; --accent: #4facfe; --bg: #050a18; 
            --card: rgba(255, 255, 255, 0.05);
            --glass: rgba(15, 23, 42, 0.9);
            --border: rgba(0, 242, 254, 0.3);
            --success: #00ff88; --error: #ff4d4d; --warning: #ffbd2e;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Kanit', sans-serif; }
        body { background: var(--bg); color: #fff; min-height: 100vh; overflow: hidden; }

        /* การตั้งค่าพิมพ์ PDF */
        @media print {
            .sidebar, .btn-group-export, .admin-float, .live-status, .no-print, .btn-action { display: none !important; }
            .main-content { padding: 0 !important; width: 100% !important; }
            body { background: white !important; color: black !important; }
            table { width: 100% !important; border-collapse: collapse; color: black !important; }
            th, td { border: 1px solid #000 !important; padding: 10px !important; }
        }

        .app-view { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; }
        .app-container { width: 350px; height: 650px; background: var(--card); backdrop-filter: blur(25px); border-radius: 40px; padding: 30px; border: 1px solid rgba(255,255,255,0.1); position: relative; }
        .phase { display: none; flex-direction: column; align-items: center; width: 100%; }
        .phase.active { display: flex; }
        
        /* Scanner */
        .scanner-view { width: 100%; height: 260px; border-radius: 25px; overflow: hidden; position: relative; background: #000; border: 2px solid var(--primary); margin-top: 20px; }
        .scanner-view.detected { border-color: var(--success); box-shadow: 0 0 20px rgba(0,255,136,0.4); }
        video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
        .laser { position: absolute; width: 100%; height: 2px; background: var(--primary); animation: scan 2s infinite ease-in-out; }
        @keyframes scan { 0%, 100% { top: 0%; } 50% { top: 100%; } }

        /* Scan Status Text */
        .scan-status { margin: 15px 0; font-size: 0.9rem; display: flex; align-items: center; gap: 8px; }
        .status-dot { width: 10px; height: 10px; border-radius: 50%; background: #555; }

        /* UI Elements */
        .btn-main { width: 100%; padding: 16px; border: none; border-radius: 18px; background: linear-gradient(135deg, var(--primary), var(--accent)); color: #050a18; font-weight: bold; cursor: pointer; }
        .btn-main:disabled { opacity: 0.3; filter: grayscale(1); }
        
        /*ปุ่มแก้ไข/ลบ แบบสวยๆ */
        .btn-edit { background: rgba(0, 242, 254, 0.1); border: 1px solid var(--primary); color: var(--primary); padding: 5px 12px; border-radius: 8px; cursor: pointer; transition: 0.3s; }
        .btn-edit:hover { background: var(--primary); color: #000; }
        .btn-delete { background: rgba(255, 77, 77, 0.1); border: 1px solid var(--error); color: var(--error); padding: 5px 12px; border-radius: 8px; cursor: pointer; margin-left: 5px; }
        .btn-delete:hover { background: var(--error); color: #fff; }

        /* Admin Layout */
        #admin-panel { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg); z-index: 1000; }
        .sidebar { width: 260px; background: rgba(255,255,255,0.03); border-right: 1px solid rgba(255,255,255,0.1); display: flex; flex-direction: column; padding: 30px; }
        .main-content { flex: 1; padding: 40px; overflow-y: auto; }
        .menu-item { padding: 14px; border-radius: 12px; cursor: pointer; margin-bottom: 10px; color: #aaa; }
        .menu-item.active { background: rgba(0, 242, 254, 0.1); color: var(--primary); font-weight: 600; }
        
        .live-status { display: flex; align-items: center; gap: 8px; font-size: 0.75rem; color: var(--success); }
        .pulse-dot { width: 8px; height: 8px; background: var(--success); border-radius: 50%; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(0, 255, 136, 0.7); } 70% { box-shadow: 0 0 0 10px rgba(0, 255, 136, 0); } 100% { box-shadow: 0 0 0 0 rgba(0, 255, 136, 0); } }

        .admin-float { position: fixed; bottom: 25px; right: 25px; width: 55px; height: 55px; background: var(--primary); border-radius: 50%; display: flex; justify-content: center; align-items: center; cursor: pointer; z-index: 500; color:#000; }
    </style>
</head>
<body>

    <div id="modal-login" style="display:none;" class="modal-overlay"><div class="modal-box"><h3>🔒 เข้าสู่ระบบ Admin</h3><input type="password" id="admin-pass" style="width:100%; padding:12px; margin:20px 0; background:#000; color:#fff; border:1px solid #333; border-radius:10px; text-align:center;"><button class="btn-main" onclick="checkAdminPass()">ตกลง</button></div></div>

    <div id="modal-edit" style="display:none;" class="modal-overlay"><div class="modal-box"><h3>📝 แก้ไขพนักงาน</h3><input type="hidden" id="edit-id"><input type="text" id="edit-f" placeholder="ชื่อ" style="width:100%; padding:10px; margin-top:15px;"><input type="text" id="edit-l" placeholder="นามสกุล" style="width:100%; padding:10px; margin-top:10px;"><button class="btn-main" onclick="submitEdit()" style="margin-top:20px;">บันทึก</button><button class="btn-sub" onclick="toggleModal('modal-edit', false)">ยกเลิก</button></div></div>

    <div class="app-view" id="app-view">
        <div class="app-container">
            <div class="phase active" id="phase1">
                <h2 style="color:var(--primary);">AI FACE ID</h2>
                <div class="scanner-view" id="wrapper1"><video id="vid1" autoplay muted playsinline></video><div class="laser"></div></div>
                <div class="scan-status"><div class="status-dot" id="dot1"></div><span id="txt1" style="color:var(--warning)">🔍 กำลังตรวจหาใบหน้า...</span></div>
                <button class="btn-main" id="btn1" onclick="doAction('checkin')" disabled>ลงเวลาทำงาน</button>
                <button class="btn-sub" onclick="setPhase(2)">ลงทะเบียนพนักงาน</button>
            </div>
            <div class="phase" id="phase2"><h3>ลงทะเบียน</h3><input type="text" id="reg-f" placeholder="ชื่อจริง" style="width:100%; padding:15px; margin:20px 0;"><input type="text" id="reg-l" placeholder="นามสกุล" style="width:100%; padding:15px; margin-bottom:20px;"><button class="btn-main" onclick="setPhase(3)">ต่อไป</button></div>
            <div class="phase" id="phase3"><h3>สแกนใบหน้า</h3><div class="scanner-view" id="wrapper3"><video id="vid3" autoplay muted playsinline></video></div><div class="scan-status"><div class="status-dot" id="dot3"></div><span id="txt3">รอตรวจพบ...</span></div><button class="btn-main" id="btn3" onclick="doAction('register')" disabled>บันทึกใบหน้า</button></div>
            <div class="phase" id="phase4"><h1 id="res-icon">⌛</h1><p id="res-msg">...</p><button class="btn-main" onclick="setPhase(1)">ตกลง</button></div>
        </div>
    </div>

    <div class="admin-float" onclick="toggleModal('modal-login', true)">📊</div>

    <div id="admin-panel">
        <div style="display:flex; height:100%;">
            <div class="sidebar">
                <h2>ADMIN</h2>
                <div class="menu-item active" id="m-report" onclick="switchTab('tab-report')">📋 รายงานวันนี้</div>
                <div class="menu-item" id="m-emp" onclick="switchTab('tab-emp')">👥 พนักงาน</div>
                <div class="menu-item" style="margin-top:auto; color:var(--error);" onclick="closeAdmin()">🚪 ออกจากระบบ</div>
            </div>
            <div class="main-content">
                <div id="tab-report">
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
                        <div class="live-status"><div class="pulse-dot"></div> Live Report</div>
                        <div><button style="background:#2ecc71; color:white; padding:8px 15px; border:none; border-radius:8px; cursor:pointer;" onclick="exportToExcel()">📊 Excel</button><button style="background:#e74c3c; color:white; padding:8px 15px; border:none; border-radius:8px; cursor:pointer; margin-left:5px;" onclick="window.print()">📄 PDF</button></div>
                    </div>
                    <table style="width:100%; border-collapse:collapse;">
                        <thead><tr><th>วันที่</th><th>ID</th><th>ชื่อ</th><th>นามสกุล</th><th>เข้า</th><th>ออก</th><th>สถานะ</th></tr></thead>
                        <tbody id="logBody"></tbody>
                    </table>
                </div>
                <div id="tab-emp" style="display:none;">
                    <h3>จัดการพนักงาน</h3>
                    <table style="width:100%; border-collapse:collapse; margin-top:20px;">
                        <thead><tr><th>ID</th><th>ชื่อ</th><th>นามสกุล</th><th>จัดการ</th></tr></thead>
                        <tbody id="empBody"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        const scriptURL = 'https://script.google.com/macros/s/AKfycbxzJcJEEWW-vtytGQfO0z5paz8OifXw4toViTRsO_HYfzyUCPChpMXbFKP_U4VVvMIGag/exec';
        let currentDesc = null, detectInt = null, syncInt = null;

        async function initAI() {
            const URL = 'https://raw.githubusercontent.com/justadudewhohacks/face-api.js/master/weights';
            await faceapi.nets.tinyFaceDetector.loadFromUri(URL);
            await faceapi.nets.faceLandmark68Net.loadFromUri(URL);
            await faceapi.nets.faceRecognitionNet.loadFromUri(URL);
            startCam(1);
        }

        async function startCam(p) {
            const vid = document.getElementById('vid'+p), wrap = document.getElementById('wrapper'+p);
            const dot = document.getElementById('dot'+p), txt = document.getElementById('txt'+p), btn = document.getElementById('btn'+p);
            const stream = await navigator.mediaDevices.getUserMedia({ video: true });
            vid.srcObject = stream;
            vid.onplay = () => {
                const canvas = faceapi.createCanvasFromMedia(vid); wrap.append(canvas);
                detectInt = setInterval(async () => {
                    const det = await faceapi.detectSingleFace(vid, new faceapi.TinyFaceDetectorOptions()).withFaceLandmarks().withFaceDescriptor();
                    if(det) {
                        currentDesc = Array.from(det.descriptor);
                        txt.innerText = "✅ ตรวจพบใบหน้าแล้ว!"; txt.style.color = "var(--success)";
                        dot.style.background = "var(--success)"; btn.disabled = false;
                    } else {
                        txt.innerText = "🔍 กำลังตรวจหาใบหน้า..."; txt.style.color = "var(--warning)";
                        dot.style.background = "#555"; btn.disabled = true;
                    }
                }, 500);
            };
        }

        function setPhase(n) {
            clearInterval(detectInt);
            document.querySelectorAll('.phase').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('video').forEach(v => v.srcObject?.getTracks().forEach(t => t.stop()));
            document.querySelectorAll('canvas').forEach(c => c.remove());
            document.getElementById('phase'+n).classList.add('active');
            if(n==1 || n==3) startCam(n);
        }

        async function doAction(act) {
            const p = { action:act, faceDescriptor:currentDesc, firstName:document.getElementById('reg-f').value, lastName:document.getElementById('reg-l').value };
            setPhase(4);
            const res = await fetch(scriptURL, { method:'POST', body:JSON.stringify(p) });
            const msg = await res.text();
            document.getElementById('res-msg').innerText = msg;
            document.getElementById('res-icon').innerText = msg.includes("✅") ? "✅" : "⚠️";
        }

        function toggleModal(id, s) { document.getElementById(id).style.display = s ? 'flex' : 'none'; }
        function checkAdminPass() { if(document.getElementById('admin-pass').value === "1234") { toggleModal('modal-login', false); document.getElementById('admin-panel').style.display='block'; fetchData(); syncInt = setInterval(fetchData, 5000); } }
        
        async function fetchData() {
            const resL = await fetch(scriptURL + "?action=getLogs");
            const logs = await resL.json();
            document.getElementById('logBody').innerHTML = logs.reverse().map(r => `<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td><td>${r[3]}</td><td>${r[4]}</td><td>${r[5]}</td><td>${r[6]}</td></tr>`).join('');

            const resE = await fetch(scriptURL + "?action=getEmployees");
            const emps = await resE.json();
            document.getElementById('empBody').innerHTML = emps.map(r => `<tr>
                <td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td>
                <td>
                    <button class="btn-edit" onclick="openEdit('${r[0]}','${r[1]}','${r[2]}')">แก้ไข</button>
                    <button class="btn-delete" onclick="handleDel('${r[0]}')">ลบ</button>
                </td>
            </tr>`).join('');
        }

        function openEdit(id, f, l) { document.getElementById('edit-id').value=id; document.getElementById('edit-f').value=f; document.getElementById('edit-l').value=l; toggleModal('modal-edit', true); }
        async function submitEdit() { /* Logic ส่งไป Apps Script */ toggleModal('modal-edit', false); fetchData(); }
        function switchTab(id) { document.getElementById('tab-report').style.display = id==='tab-report'?'block':'none'; document.getElementById('tab-emp').style.display = id==='tab-emp'?'block':'none'; }
        function exportToExcel() { XLSX.writeFile(XLSX.utils.table_to_book(document.querySelector("#tab-report table")), "Report.xlsx"); }
        function closeAdmin() { clearInterval(syncInt); document.getElementById('admin-panel').style.display='none'; setPhase(1); }
        initAI();
    </script>
</body>
</html>
