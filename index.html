<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real FaceID Register - OneBlock</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@200;300;400;600&display=swap" rel="stylesheet">
    
    <script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>

    <style>
        :root { --primary: #00f2fe; --accent: #4facfe; --glass: rgba(255, 255, 255, 0.05); }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Kanit', sans-serif;
            background: radial-gradient(circle, #1e293b, #050a18);
            color: #fff; min-height: 100vh; display: flex; justify-content: center; align-items: center;
        }

        .unified-block {
            width: 360px; height: 680px; background: var(--glass);
            backdrop-filter: blur(25px); border: 1px solid rgba(255,255,255,0.1);
            border-radius: 40px; padding: 35px; display: flex; flex-direction: column; position: relative;
            box-shadow: 0 40px 100px rgba(0,0,0,0.5); overflow: hidden;
        }

        .phase { display: none; width: 100%; height: 100%; flex-direction: column; align-items: center; animation: fadeIn 0.4s; }
        .phase.active { display: flex; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        input {
            width: 100%; padding: 14px; margin-bottom: 12px; border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.1); background: rgba(0,0,0,0.2); color: white; font-family: 'Kanit';
        }

        .btn-action {
            width: 100%; padding: 16px; border: none; border-radius: 18px; margin-top: auto;
            background: linear-gradient(90deg, var(--primary), var(--accent));
            color: #000; font-weight: 600; cursor: pointer; font-family: 'Kanit';
        }

        .scanner-view {
            width: 100%; height: 280px; border-radius: 25px; overflow: hidden;
            position: relative; background: #000; border: 2px solid var(--primary);
        }
        #video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
        canvas { position: absolute; top: 0; left: 0; transform: scaleX(-1); }
        
        .laser {
            position: absolute; width: 100%; height: 3px; background: var(--primary);
            box-shadow: 0 0 15px var(--primary); animation: scan 2s infinite ease-in-out; z-index: 5;
        }
        @keyframes scan { 0%, 100% { top: 0%; } 50% { top: 100%; } }

        #loading-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: #0f172a; display: flex; flex-direction: column; 
            justify-content: center; align-items: center; z-index: 100;
        }
    </style>
</head>
<body>

    <div class="unified-block">
        <div id="loading-overlay">
            <div style="border: 3px solid #333; border-top-color: var(--primary); border-radius: 50%; width: 30px; height: 30px; animation: spin 1s infinite linear;"></div>
            <p style="margin-top: 15px; font-size: 0.8rem; color: var(--primary);">กำลังเตรียม AI...</p>
        </div>

        <div class="phase active" id="phase1">
            <h2 style="font-weight: 400; margin-bottom: 10px; color: var(--primary);">FaceID Register</h2>
            <p style="font-size: 0.8rem; opacity: 0.6; margin-bottom: 30px; text-align: center;">กรอกข้อมูลให้ครบเพื่อเริ่มสแกนหน้า</p>
            <input type="text" id="fname" placeholder="ชื่อ">
            <input type="text" id="lname" placeholder="นามสกุล">
            <input type="text" id="pos" placeholder="ตำแหน่ง">
            <button class="btn-action" onclick="startCameraPhase()">ถัดไป: สแกนใบหน้า</button>
        </div>

        <div class="phase" id="phase2">
            <div class="scanner-view">
                <video id="video" autoplay muted playsinline></video>
                <div class="laser"></div>
            </div>
            <p id="status" style="margin-top: 20px; font-size: 0.8rem; color: var(--primary);">กำลังค้นหาใบหน้า...</p>
            <button class="btn-action" id="save-btn" onclick="saveData()" disabled>ยืนยันและบันทึก</button>
        </div>

        <div class="phase" id="phase3">
            <div style="background: rgba(0,255,136,0.1); color: #00ff88; padding: 5px 15px; border-radius: 20px; font-size: 0.8rem; margin-bottom: 20px;">บันทึกสำเร็จ</div>
            <h3 id="res-name">-</h3>
            <p id="res-pos" style="color: var(--primary); font-size: 0.8rem; margin-top: 5px;">-</p>
            <div style="width: 100%; margin-top: 30px; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 20px;">
                <p style="font-size: 0.7rem; opacity: 0.4;">Face Descriptor บันทึกลงระบบแล้ว</p>
            </div>
            <button class="btn-action" onclick="location.reload()">ลงทะเบียนคนถัดไป</button>
        </div>
    </div>

    <script>
// *** 1. ใส่ Web App URL ของคุณที่นี่ ***
const scriptURL = 'https://script.google.com/macros/s/AKfycbxEvDqjvEmgBY7Xk7O96CmT5eX-BA_gLUaV9-sbay_vBa4-5lbmpwW124tNnLHd7Xv1gA/exec'; 

const video = document.getElementById('video');
let currentDescriptor = null;

// ฟังก์ชันโหลด Model พร้อมระบบจัดการ Error
async function loadModels() {
    const loadingText = document.querySelector('#loading-overlay p');
    try {
        // ใช้ CDN สำรองที่เสถียรที่สุด
        const MODEL_URL = 'https://raw.githubusercontent.com/justadudewhohacks/face-api.js/master/weights';
        
        loadingText.innerText = "กำลังโหลด Detector...";
        await faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL);
        
        loadingText.innerText = "กำลังโหลด Landmarks...";
        await faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL);
        
        loadingText.innerText = "กำลังโหลด Recognition...";
        await faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL);

        document.getElementById('loading-overlay').style.display = 'none';
        console.log("AI Models Loaded Successfully");
    } catch (e) {
        console.error("AI Load Error:", e);
        loadingText.innerHTML = "โหลด AI ไม่สำเร็จ <br><button onclick='location.reload()' style='margin-top:10px; padding:5px 10px; border-radius:5px;'>ลองใหม่อีกครั้ง</button>";
        loadingText.style.color = "#ff4d4d";
    }
}

// เริ่มต้นโหลด
loadModels();

async function startCameraPhase() {
    const fname = document.getElementById('fname').value;
    const pos = document.getElementById('pos').value;
    
    if(!fname || !pos) {
        alert("กรุณากรอกข้อมูลให้ครบถ้วนก่อนสแกน");
        return;
    }
    
    document.getElementById('phase1').classList.remove('active');
    document.getElementById('phase2').classList.add('active');

    try {
        const stream = await navigator.mediaDevices.getUserMedia({ 
            video: { 
                facingMode: "user",
                width: { ideal: 640 },
                height: { ideal: 480 }
            } 
        });
        video.srcObject = stream;
    } catch (err) {
        alert("ไม่สามารถเปิดกล้องได้: " + err.message);
        location.reload();
    }

    video.addEventListener('play', () => {
        // ลบ Canvas เก่าออกก่อนถ้ามี
        const oldCanvas = document.querySelector('canvas');
        if(oldCanvas) oldCanvas.remove();

        const canvas = faceapi.createCanvasFromMedia(video);
        document.querySelector('.scanner-view').append(canvas);
        
        const displaySize = { width: video.offsetWidth, height: video.offsetHeight };
        faceapi.matchDimensions(canvas, displaySize);

        const detectLoop = setInterval(async () => {
            if (video.paused || video.ended) {
                clearInterval(detectLoop);
                return;
            }

            const detection = await faceapi.detectSingleFace(
                video, 
                new faceapi.TinyFaceDetectorOptions()
            ).withFaceLandmarks().withFaceDescriptor();

            canvas.getContext('2d').clearRect(0, 0, canvas.width, canvas.height);
            
            if (detection) {
                const resized = faceapi.resizeResults(detection, displaySize);
                faceapi.draw.drawFaceLandmarks(canvas, resized);
                
                // เก็บค่าใบหน้า
                currentDescriptor = Array.from(detection.descriptor);
                
                document.getElementById('status').innerText = "ตรวจจับใบหน้าสำเร็จ!";
                document.getElementById('status').style.color = "#00ff88";
                document.getElementById('save-btn').disabled = false;
            } else {
                document.getElementById('status').innerText = "กรุณามองกล้องตรงๆ...";
                document.getElementById('status').style.color = "var(--primary)";
                document.getElementById('save-btn').disabled = true;
            }
        }, 200);
    });
}

async function saveData() {
    const saveBtn = document.getElementById('save-btn');
    saveBtn.innerText = "กำลังส่งข้อมูล...";
    saveBtn.disabled = true;

    const payload = {
        firstName: document.getElementById('fname').value,
        lastName: document.getElementById('lname').value,
        position: document.getElementById('pos').value,
        faceDescriptor: currentDescriptor
    };

    try {
        // ส่งแบบ no-cors เพื่อข้ามปัญหา Security ของ Google
        await fetch(scriptURL, { 
            method: 'POST', 
            mode: 'no-cors', 
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload) 
        });

        // เปลี่ยนหน้าจอผลลัพธ์
        document.getElementById('phase2').classList.remove('active');
        document.getElementById('phase3').classList.add('active');
        document.getElementById('res-name').innerText = payload.firstName + " " + (payload.lastName || "");
        document.getElementById('res-pos').innerText = payload.position;
        
        // ปิดกล้อง
        const tracks = video.srcObject.getTracks();
        tracks.forEach(track => track.stop());

    } catch (e) {
        alert("บันทึกข้อมูลไม่สำเร็จ กรุณาลองใหม่");
        saveBtn.innerText = "ยืนยันและบันทึก";
        saveBtn.disabled = false;
    }
}
