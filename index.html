<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real FaceID - Check-in & Register</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@200;300;400;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>

    <style>
        :root { --primary: #00f2fe; --accent: #4facfe; --glass: rgba(255, 255, 255, 0.05); }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Kanit', sans-serif;
            background: radial-gradient(circle, #1e293b, #050a18);
            color: #fff; min-height: 100vh; display: flex; justify-content: center; align-items: center;
        }

        .unified-block {
            width: 360px; height: 680px; background: var(--glass);
            backdrop-filter: blur(30px); border: 1px solid rgba(255,255,255,0.1);
            border-radius: 40px; padding: 30px; display: flex; flex-direction: column; position: relative;
            box-shadow: 0 40px 100px rgba(0,0,0,0.5); overflow: hidden;
        }

        .phase { display: none; width: 100%; height: 100%; flex-direction: column; align-items: center; animation: fadeIn 0.4s; }
        .phase.active { display: flex; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        input {
            width: 100%; padding: 14px; margin-bottom: 12px; border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.1); background: rgba(0,0,0,0.2); color: white; font-family: 'Kanit';
        }

        .btn-action {
            width: 100%; padding: 16px; border: none; border-radius: 18px; margin-top: auto;
            background: linear-gradient(90deg, var(--primary), var(--accent));
            color: #000; font-weight: 600; cursor: pointer; font-family: 'Kanit';
            transition: all 0.3s;
        }
        .btn-action:disabled { background: #555; color: #aaa; cursor: not-allowed; }
        .btn-secondary { background: rgba(255,255,255,0.05); color: #fff; border: 1px solid rgba(255,255,255,0.1); margin-top: 10px; }

        .scanner-view {
            width: 100%; height: 280px; border-radius: 25px; overflow: hidden;
            position: relative; background: #000; border: 2px solid var(--primary);
            display: flex; justify-content: center; align-items: center;
        }
        .scanner-view.detected { border-color: #00ff88; box-shadow: 0 0 20px rgba(0, 255, 136, 0.4); }
        
        video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
        canvas { position: absolute; top: 0; left: 0; transform: scaleX(-1); pointer-events: none; }
        
        .laser {
            position: absolute; width: 100%; height: 3px; background: var(--primary);
            box-shadow: 0 0 15px var(--primary); animation: scan 2s infinite ease-in-out; z-index: 5;
        }
        @keyframes scan { 0%, 100% { top: 0%; } 50% { top: 100%; } }

        #loading-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: #0f172a; display: flex; flex-direction: column; 
            justify-content: center; align-items: center; z-index: 100;
        }
        .spinner { border: 3px solid #333; border-top-color: var(--primary); border-radius: 50%; width: 30px; height: 30px; animation: spin 1s infinite linear; }
        @keyframes spin { to { transform: rotate(360deg); } }

        .result-img-container { width: 100px; height: 100px; border-radius: 50%; border: 3px solid var(--primary); margin-bottom: 15px; overflow: hidden; }
        #result-img { width: 100%; height: 100%; object-fit: cover; }
    </style>
</head>
<body>

    <div class="unified-block">
        <div id="loading-overlay">
            <div class="spinner"></div>
            <p id="load-msg" style="margin-top: 15px; font-size: 0.8rem; color: var(--primary);">กำลังเริ่มระบบ AI...</p>
        </div>

        <div class="phase active" id="phase1">
            <h2 style="color: var(--primary); margin-bottom: 20px;">ลงเวลาทำงาน</h2>
            <div class="scanner-view" id="wrapper1">
                <video id="vid1" autoplay muted playsinline></video>
                <div class="laser"></div>
            </div>
            <p id="stat1" style="margin-top: 15px; font-size: 0.85rem; color: var(--primary);">กำลังค้นหาใบหน้า...</p>
            <button class="btn-action" id="btn1" onclick="handleAction('checkin')" disabled>ลงเวลาทำงาน</button>
            <button class="btn-action btn-secondary" onclick="changePhase(2)">ลงทะเบียนพนักงานใหม่</button>
        </div>

        <div class="phase" id="phase2">
            <h2 style="color: var(--primary); margin-bottom: 5px;">ลงทะเบียน</h2>
            <p style="font-size: 0.8rem; opacity: 0.6; margin-bottom: 25px;">กรุณากรอกข้อมูลให้ครบถ้วน</p>
            <input type="text" id="fname" placeholder="ชื่อ">
            <input type="text" id="lname" placeholder="นามสกุล">
            <input type="text" id="pos" placeholder="ตำแหน่ง">
            <button class="btn-action" onclick="changePhase(3)">ถัดไป: สแกนใบหน้า</button>
            <button class="btn-action btn-secondary" onclick="changePhase(1)">ยกเลิก</button>
        </div>

        <div class="phase" id="phase3">
            <h2 style="color: var(--primary); margin-bottom: 20px;">สแกนใบหน้าใหม่</h2>
            <div class="scanner-view" id="wrapper3">
                <video id="vid3" autoplay muted playsinline></video>
                <div class="laser"></div>
            </div>
            <p id="stat3" style="margin-top: 15px; font-size: 0.85rem; color: var(--primary);">กรุณามองกล้อง...</p>
            <button class="btn-action" id="btn3" onclick="handleAction('register')" disabled>ยืนยันบันทึกข้อมูล</button>
            <button class="btn-action btn-secondary" onclick="changePhase(2)">กลับไปแก้ไขข้อมูล</button>
        </div>

        <div class="phase" id="phase4">
            <div style="background: rgba(0,255,136,0.1); color: #00ff88; padding: 5px 15px; border-radius: 20px; font-size: 0.8rem; margin-bottom: 15px;">สำเร็จ</div>
            <div class="result-img-container"><img id="result-img" src=""></div>
            <h3 id="res-name">-</h3>
            <p id="res-pos" style="color: var(--primary); font-size: 0.8rem;">-</p>
            <button class="btn-action" onclick="changePhase(1)" style="margin-top: 30px;">กลับหน้าหลัก</button>
        </div>
    </div>

    <script>
        // *** 1. ใส่ URL ของคุณที่นี่ ***
        const scriptURL = 'https://script.google.com/macros/s/AKfycbwNgbtC-bCkLppmq6-YUatMijekEO7v9KAvV91de163YykUBQfqaWXxzZwGUk2PEM6nug/exec'; 
        
        let currentDescriptor = null;
        let detectLoop = null;

        async function initAI() {
            try {
                const MODEL_URL = window.location.origin + window.location.pathname.replace(/\/[^\/]*$/, '') + '/models';
                await faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL);
                await faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL);
                await faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL);
                document.getElementById('loading-overlay').style.display = 'none';
                startCamera(1);
            } catch (e) {
                document.getElementById('load-msg').innerText = "โหลด AI ผิดพลาด เช็ค Path models";
            }
        }

        async function startCamera(phaseNum) {
            const video = document.getElementById('vid' + phaseNum);
            const wrapper = document.getElementById('wrapper' + phaseNum);
            const status = document.getElementById('stat' + phaseNum);
            const button = document.getElementById('btn' + phaseNum);

            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 480 } });
                video.srcObject = stream;
                
                video.onplay = () => {
                    const canvas = faceapi.createCanvasFromMedia(video);
                    wrapper.append(canvas);
                    const displaySize = { width: video.offsetWidth, height: video.offsetHeight };
                    faceapi.matchDimensions(canvas, displaySize);

                    detectLoop = setInterval(async () => {
                        const detection = await faceapi.detectSingleFace(video, new faceapi.TinyFaceDetectorOptions())
                            .withFaceLandmarks().withFaceDescriptor();
                        
                        const ctx = canvas.getContext('2d');
                        ctx.clearRect(0, 0, canvas.width, canvas.height);

                        if (detection) {
                            const resized = faceapi.resizeResults(detection, displaySize);
                            drawFaceOverlay(ctx, resized.landmarks);
                            currentDescriptor = Array.from(detection.descriptor);
                            wrapper.classList.add('detected');
                            status.innerText = "ตรวจจับสำเร็จ!";
                            status.style.color = "#00ff88";
                            button.disabled = false;
                        } else {
                            wrapper.classList.remove('detected');
                            status.innerText = "กำลังค้นหาใบหน้า...";
                            status.style.color = "var(--primary)";
                            button.disabled = true;
                        }
                    }, 200);
                };
            } catch (err) { alert("กล้องไม่ทำงาน: " + err); }
        }

        function changePhase(num) {
            clearInterval(detectLoop);
            document.querySelectorAll('.phase').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('video').forEach(v => { if(v.srcObject) v.srcObject.getTracks().forEach(t => t.stop()); });
            document.querySelectorAll('canvas').forEach(c => c.remove());
            
            document.getElementById('phase' + num).classList.add('active');
            if(num === 1 || num === 3) startCamera(num);
        }

        async function handleAction(actionType) {
            const btn = document.querySelector('.phase.active .btn-action');
            btn.innerText = "กำลังส่งข้อมูล...";
            btn.disabled = true;

            const video = document.querySelector('.phase.active video');
            const captureCanvas = document.createElement('canvas');
            captureCanvas.width = video.videoWidth; captureCanvas.height = video.videoHeight;
            const ctx = captureCanvas.getContext('2d');
            ctx.scale(-1, 1);
            ctx.drawImage(video, -captureCanvas.width, 0, captureCanvas.width, captureCanvas.height);
            const imgData = captureCanvas.toDataURL('image/jpeg');

            const payload = {
                action: actionType,
                firstName: document.getElementById('fname').value,
                lastName: document.getElementById('lname').value,
                position: document.getElementById('pos').value,
                faceDescriptor: currentDescriptor
            };

            await fetch(scriptURL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(payload) });

            document.getElementById('result-img').src = imgData;
            document.getElementById('res-name').innerText = actionType === 'checkin' ? "ลงเวลารับทราบ" : payload.firstName;
            document.getElementById('res-pos').innerText = actionType === 'checkin' ? "ยินดีต้อนรับ" : payload.position;
            changePhase(4);
        }

        function drawFaceOverlay(ctx, landmarks) {
            ctx.strokeStyle = '#00ff88'; ctx.lineWidth = 2; ctx.beginPath();
            const jaw = landmarks.getJawOutline();
            ctx.moveTo(jaw[0].x, jaw[0].y);
            jaw.forEach(p => ctx.lineTo(p.x, p.y));
            ctx.stroke();
        }

        initAI();
    </script>
</body>
</html>
