<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI FaceID Ultimate - Full System</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
    <style>
        :root { 
            --primary: #00f2fe; --accent: #4facfe; --bg: #050a18; 
            --card: rgba(255, 255, 255, 0.05);
            --glass: rgba(15, 23, 42, 0.9);
            --border: rgba(0, 242, 254, 0.3);
            --success: #00ff88; --error: #ff4d4d;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Kanit', sans-serif; }
        body { background: var(--bg); color: #fff; min-height: 100vh; overflow: hidden; }

        /* UI Base */
        .app-view { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; }
        .app-container { width: 350px; height: 620px; background: var(--card); backdrop-filter: blur(25px); border-radius: 40px; padding: 30px; border: 1px solid rgba(255,255,255,0.1); box-shadow: 0 25px 50px rgba(0,0,0,0.6); position: relative; }
        .phase { display: none; flex-direction: column; align-items: center; width: 100%; height: 100%; }
        .phase.active { display: flex; justify-content: center; }
        .scanner-view { width: 100%; height: 260px; border-radius: 25px; overflow: hidden; position: relative; background: #000; border: 2px solid var(--primary); margin: 20px 0; }
        .scanner-view.detected { border-color: var(--success); box-shadow: 0 0 20px rgba(0,255,136,0.4); }
        video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
        canvas { position: absolute; top: 0; left: 0; transform: scaleX(-1); pointer-events: none; }
        .laser { position: absolute; width: 100%; height: 2px; background: var(--primary); animation: scan 2s infinite ease-in-out; }
        @keyframes scan { 0%, 100% { top: 0%; } 50% { top: 100%; } }

        /* Inputs & Buttons */
        input, select { width: 100%; padding: 14px; margin-bottom: 12px; border-radius: 15px; border: 1px solid rgba(255,255,255,0.1); background: rgba(0,0,0,0.4); color: #fff; outline: none; }
        .btn-main { width: 100%; padding: 16px; border: none; border-radius: 18px; background: linear-gradient(135deg, var(--primary), var(--accent)); color: #050a18; font-weight: bold; cursor: pointer; transition: 0.3s; margin-top: 10px; }
        .btn-sub { width: 100%; padding: 10px; background: none; color: #aaa; border: none; margin-top: 5px; cursor: pointer; }
        .btn-excel { background: linear-gradient(135deg, #2ecc71, #27ae60); color: white; padding: 8px 16px; border-radius: 10px; border: none; cursor: pointer; font-size: 0.8rem; font-weight: 600; display: flex; align-items: center; gap: 5px; }

        /* Modals */
        .modal-overlay { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,5,15,0.85); backdrop-filter:blur(15px); z-index:5000; align-items:center; justify-content:center; }
        .modal-box { background: var(--glass); width:380px; padding:35px; border-radius:35px; border:1px solid var(--border); text-align:center; animation: modalPop 0.3s cubic-bezier(0.34, 1.56, 0.64, 1); }
        @keyframes modalPop { from { opacity: 0; transform: scale(0.85); } to { opacity: 1; transform: scale(1); } }
        
        label { display: block; text-align: left; font-size: 0.75rem; color: var(--primary); margin: 0 0 5px 6px; font-weight: 600; }
        #toast-container { position: fixed; top: 20px; right: 20px; z-index: 9999; }
        .toast { background: var(--glass); border: 1px solid var(--border); padding: 16px 25px; border-radius: 20px; margin-bottom: 10px; display: flex; align-items: center; gap: 12px; transform: translateX(120%); transition: 0.5s; border-left: 5px solid var(--primary); }
        .toast.show { transform: translateX(0); }

        /* Admin Panel */
        #admin-panel { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg); z-index: 1000; }
        .sidebar { width: 260px; background: rgba(255,255,255,0.03); border-right: 1px solid rgba(255,255,255,0.1); display: flex; flex-direction: column; padding: 30px; }
        .menu-item { padding: 14px 18px; border-radius: 15px; cursor: pointer; margin-bottom: 10px; color: #aaa; transition: 0.3s; }
        .menu-item.active { background: rgba(0, 242, 254, 0.1); color: var(--primary); font-weight: 600; }
        .main-content { flex: 1; padding: 40px; overflow-y: auto; }
        .table-container { background: rgba(255,255,255,0.02); border-radius: 20px; border: 1px solid rgba(255,255,255,0.05); overflow: hidden; }
        table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
        th, td { padding: 15px; text-align: left; border-bottom: 1px solid rgba(255,255,255,0.03); }
        .admin-float { position: fixed; bottom: 25px; right: 25px; width: 55px; height: 55px; background: var(--primary); border-radius: 50%; display: flex; justify-content: center; align-items: center; cursor: pointer; color:#000; z-index: 500; }
    </style>
</head>
<body>

    <div id="toast-container"></div>

    <div id="custom-dialog" class="modal-overlay"><div class="modal-box"><div id="dialog-icon" style="font-size:50px; margin-bottom:15px;">✅</div><h3 id="dialog-title"></h3><p id="dialog-msg"></p><div style="display:flex; justify-content:center; gap:10px;"><button id="btn-dialog-ok" class="btn-main" style="width:120px; margin:0">ตกลง</button><button id="btn-dialog-cancel" class="btn-sub" style="color:#ff4d4d; display:none;">ยกเลิก</button></div></div></div>

    <div id="modal-edit" class="modal-overlay"><div class="modal-box"><h3>📝 แก้ไขพนักงาน</h3><input type="hidden" id="edit-id"><label>ชื่อจริง</label><input type="text" id="edit-f"><label>นามสกุล</label><input type="text" id="edit-l"><label>ตำแหน่ง</label><select id="edit-p"><option value="ผู้บริหาร">ผู้บริหาร</option><option value="ครู">ครู</option><option value="เจ้าหน้าที่">เจ้าหน้าที่</option></select><button class="btn-main" onclick="submitEdit()">บันทึก</button><button class="btn-sub" onclick="toggleModal('modal-edit', false)">ยกเลิก</button></div></div>

    <div id="modal-gps" class="modal-overlay"><div class="modal-box"><h3>📍 ตั้งค่า GPS</h3><label>Latitude</label><input type="number" id="set-lat" step="any"><label>Longitude</label><input type="number" id="set-lng" step="any"><label>รัศมี (เมตร)</label><input type="number" id="set-radius"><div style="color:var(--primary); cursor:pointer; font-size:0.85rem; margin-bottom:15px" onclick="getCurrentLoc()">🎯 ดึงพิกัดปัจจุบัน</div><button class="btn-main" onclick="saveSettings()">บันทึก</button><button class="btn-sub" onclick="toggleModal('modal-gps', false)">ยกเลิก</button></div></div>

    <div class="app-view" id="app-view">
        <div class="app-container">
            <div class="phase active" id="phase1">
                <h2 style="color:var(--primary);">AI FACE ID</h2>
                <div class="scanner-view" id="wrapper1"><video id="vid1" autoplay muted playsinline></video><div class="laser"></div></div>
                <button class="btn-main" id="btn1" onclick="doAction('checkin')" disabled>ลงเวลาทำงาน</button>
                <button class="btn-sub" onclick="setPhase(2)">ลงทะเบียนพนักงาน</button>
            </div>
            <div class="phase" id="phase2">
                <h3>ข้อมูลพนักงาน</h3>
                <input type="text" id="reg-f" placeholder="ชื่อจริง"><input type="text" id="reg-l" placeholder="นามสกุล"><select id="reg-p"><option value="ผู้บริหาร">ผู้บริหาร</option><option value="ครู">ครู</option><option value="เจ้าหน้าที่">เจ้าหน้าที่</option></select>
                <button class="btn-main" onclick="setPhase(3)">ต่อไป</button><button class="btn-sub" onclick="setPhase(1)">ยกเลิก</button>
            </div>
            <div class="phase" id="phase3"><div class="scanner-view" id="wrapper3"><video id="vid3" autoplay muted playsinline></video></div><button class="btn-main" id="btn3" onclick="doAction('register')" disabled>ยืนยันลงทะเบียน</button></div>
            <div class="phase" id="phase4"><div id="res-icon" style="font-size:70px; margin-bottom:20px;">⏳</div><p id="res-msg"></p><button class="btn-main" onclick="setPhase(1)">ตกลง</button></div>
        </div>
    </div>

    <div class="admin-float" onclick="toggleModal('modal-login', true)">📊</div>
    <div id="modal-login" class="modal-overlay"><div class="modal-box"><h3>🔒 Admin Login</h3><input type="password" id="admin-pass" placeholder="••••" style="text-align:center; font-size:2rem; letter-spacing:10px;"><button class="btn-main" onclick="checkAdminPass()">เข้าสู่ระบบ</button><button class="btn-sub" onclick="toggleModal('modal-login', false)">ปิด</button></div></div>

    <div id="admin-panel">
        <div style="display:flex; height:100%;">
            <div class="sidebar">
                <h2 style="color:var(--primary); margin-bottom:30px;">ADMIN</h2>
                <div class="menu-item active" id="m-report" onclick="switchTab('tab-report')">📋 รายงานวันนี้</div>
                <div class="menu-item" id="m-emp" onclick="switchTab('tab-emp')">👥 รายชื่อพนักงาน</div>
                <div class="menu-item" onclick="openGPSModal()">📍 ตั้งค่า GPS</div>
                <div class="menu-item" style="margin-top:auto; color:#ff4d4d;" onclick="closeAdmin()">🚪 ออกจากระบบ</div>
            </div>
            <div class="main-content">
                <div id="tab-report" class="tab-content">
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
                        <h3>รายงานประจำวัน</h3>
                        <button class="btn-excel" onclick="exportToExcel()">📊 Export Excel</button>
                    </div>
                    <div class="table-container"><table><thead><tr><th>วันที่</th><th>ID</th><th>ชื่อ</th><th>เข้า</th><th>ออก</th><th>สถานะ</th></tr></thead><tbody id="logBody"></tbody></table></div>
                </div>
                <div id="tab-emp" class="tab-content" style="display:none;">
                    <h3>จัดการพนักงาน</h3>
                    <div class="table-container"><table><thead><tr><th>ID</th><th>ชื่อ</th><th>นามสกุล</th><th>ตำแหน่ง</th><th>จัดการ</th></tr></thead><tbody id="empBody"></tbody></table></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const scriptURL = 'https://script.google.com/macros/s/AKfycbxzJcJEEWW-vtytGQfO0z5paz8OifXw4toViTRsO_HYfzyUCPChpMXbFKP_U4VVvMIGag/exec'; 
        let currentDesc = null, syncInt = null, detectInt = null, officeLoc = {lat:0, lng:0, radius:100};

        function showToast(msg) {
            const c = document.getElementById('toast-container');
            const t = document.createElement('div'); t.className = 'toast';
            t.innerHTML = `<span>✨</span> ${msg}`; c.appendChild(t);
            setTimeout(()=>t.classList.add('show'), 100);
            setTimeout(()=>{t.classList.remove('show'); setTimeout(()=>t.remove(), 500);}, 3000);
        }

        async function initAI() {
            const URL = 'https://raw.githubusercontent.com/justadudewhohacks/face-api.js/master/weights';
            await faceapi.nets.tinyFaceDetector.loadFromUri(URL);
            await faceapi.nets.faceLandmark68Net.loadFromUri(URL);
            await faceapi.nets.faceRecognitionNet.loadFromUri(URL);
            const res = await fetch(scriptURL + "?action=getSettings");
            officeLoc = await res.json();
            startCam(1);
        }

        async function startCam(p) {
            const vid = document.getElementById('vid'+p), wrap = document.getElementById('wrapper'+p), btn = document.getElementById('btn'+p);
            const stream = await navigator.mediaDevices.getUserMedia({ video: true });
            vid.srcObject = stream;
            vid.onplay = () => {
                const canvas = faceapi.createCanvasFromMedia(vid); wrap.append(canvas);
                faceapi.matchDimensions(canvas, { width: vid.offsetWidth, height: vid.offsetHeight });
                detectInt = setInterval(async () => {
                    const det = await faceapi.detectSingleFace(vid, new faceapi.TinyFaceDetectorOptions()).withFaceLandmarks().withFaceDescriptor();
                    canvas.getContext('2d').clearRect(0,0,canvas.width,canvas.height);
                    if(det) { currentDesc = Array.from(det.descriptor); wrap.classList.add('detected'); btn.disabled = false; } 
                    else { wrap.classList.remove('detected'); btn.disabled = true; }
                }, 400);
            };
        }

        function setPhase(n) {
            clearInterval(detectInt);
            document.querySelectorAll('.phase').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('video').forEach(v => v.srcObject?.getTracks().forEach(t => t.stop()));
            document.querySelectorAll('canvas').forEach(c => c.remove());
            document.getElementById('phase'+n).classList.add('active');
            if(n==1 || n==3) startCam(n);
        }

        async function doAction(act) {
            navigator.geolocation.getCurrentPosition(async (pos) => {
                const p = { action:act, faceDescriptor:currentDesc, firstName:document.getElementById('reg-f').value, lastName:document.getElementById('reg-l').value, position:document.getElementById('reg-p').value, lat:pos.coords.latitude, lng:pos.coords.longitude };
                setPhase(4); document.getElementById('res-msg').innerText = "กำลังประมวลผล...";
                const res = await fetch(scriptURL, { method:'POST', body:JSON.stringify(p) });
                const txt = await res.text(); document.getElementById('res-msg').innerText = txt;
                document.getElementById('res-icon').innerText = txt.includes("✅") ? "✅" : "⚠️";
            });
        }

        function toggleModal(id, s) { document.getElementById(id).style.display = s ? 'flex' : 'none'; }

        async function checkAdminPass() {
            if(document.getElementById('admin-pass').value === "1234") {
                toggleModal('modal-login', false); document.getElementById('admin-panel').style.display='block';
                document.getElementById('app-view').style.display='none';
                fetchData(); syncInt = setInterval(fetchData, 5000);
                showToast("ยินดีต้อนรับ Admin");
            } else showToast("รหัสไม่ถูกต้อง");
        }

        async function fetchData() {
            try {
                const resL = await fetch(scriptURL + "?action=getLogs"), logs = await resL.json();
                document.getElementById('logBody').innerHTML = logs.reverse().map(r => `<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td><td>${r[4]}</td><td>${r[5]}</td><td>${r[6]}</td></tr>`).join('');
                const resE = await fetch(scriptURL + "?action=getEmployees"), emps = await resE.json();
                document.getElementById('empBody').innerHTML = emps.map(r => `<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td><td>${r[3]}</td><td>
                    <button onclick="openEdit('${r[0]}','${r[1]}','${r[2]}','${r[3]}')" style="background:none; border:1px solid var(--primary); color:var(--primary); padding:4px 8px; border-radius:8px; cursor:pointer;">แก้ไข</button>
                    <button onclick="handleDel('${r[0]}','${r[1]}')" style="background:none; border:1px solid var(--error); color:var(--error); padding:4px 8px; border-radius:8px; cursor:pointer; margin-left:5px">ลบ</button>
                </td></tr>`).join('');
            } catch(e){}
        }

        function exportToExcel() {
            const table = document.querySelector("#tab-report table");
            const wb = XLSX.utils.table_to_book(table, { sheet: "Attendance_Report" });
            XLSX.writeFile(wb, `Report_${new Date().toLocaleDateString()}.xlsx`);
            showToast("Export Excel สำเร็จ!");
        }

        function openEdit(id,f,l,p) { 
            document.getElementById('edit-id').value=id; document.getElementById('edit-f').value=f;
            document.getElementById('edit-l').value=l; document.getElementById('edit-p').value=p;
            toggleModal('modal-edit', true); 
        }

        async function submitEdit() {
            const p = { action:"editEmployee", id:document.getElementById('edit-id').value, firstName:document.getElementById('edit-f').value, lastName:document.getElementById('edit-l').value, position:document.getElementById('edit-p').value };
            await fetch(scriptURL, {method:'POST', body:JSON.stringify(p)}); 
            toggleModal('modal-edit', false); fetchData(); showToast("อัปเดตข้อมูลแล้ว");
        }

        function openGPSModal() {
            document.getElementById('set-lat').value = officeLoc.lat;
            document.getElementById('set-lng').value = officeLoc.lng;
            document.getElementById('set-radius').value = officeLoc.radius;
            toggleModal('modal-gps', true);
        }

        async function saveSettings() {
            const p = { action:"saveSettings", lat:parseFloat(document.getElementById('set-lat').value), lng:parseFloat(document.getElementById('set-lng').value), radius:parseInt(document.getElementById('set-radius').value) };
            await fetch(scriptURL,{method:'POST', body:JSON.stringify(p)});
            officeLoc = {lat:p.lat, lng:p.lng, radius:p.radius};
            toggleModal('modal-gps', false); showToast("บันทึกพิกัดสำเร็จ");
        }

        function switchTab(id) { 
            document.querySelectorAll('.tab-content').forEach(t=>t.style.display='none');
            document.querySelectorAll('.menu-item').forEach(m=>m.classList.remove('active'));
            document.getElementById(id).style.display='block'; document.getElementById('m-'+id.split('-')[1]).classList.add('active');
        }

        function closeAdmin() { clearInterval(syncInt); document.getElementById('admin-panel').style.display='none'; document.getElementById('app-view').style.display='flex'; setPhase(1); }
        initAI();
    </script>
</body>
</html>
