<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FaceID Register System</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@200;300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #00f2fe;
            --accent: #4facfe;
            --bg: #0f172a;
            --glass: rgba(255, 255, 255, 0.05);
            --border: rgba(255, 255, 255, 0.12);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Kanit', sans-serif;
            background: radial-gradient(circle at center, #1e293b 0%, #050a18 100%);
            color: #fff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* Block เดียวหลัก */
        .unified-block {
            width: 350px;
            height: 650px;
            background: var(--glass);
            backdrop-filter: blur(25px);
            border: 1px solid var(--border);
            border-radius: 45px;
            padding: 40px 30px;
            display: flex;
            flex-direction: column;
            position: relative;
            box-shadow: 0 40px 100px rgba(0,0,0,0.5);
            overflow: hidden;
        }

        /* การจัดการเฟส */
        .phase {
            display: none;
            width: 100%;
            height: 100%;
            flex-direction: column;
            align-items: center;
            animation: fadeIn 0.5s ease;
        }

        .phase.active { display: flex; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Input Styles */
        input {
            width: 100%;
            padding: 14px;
            margin-bottom: 15px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.1);
            background: rgba(0,0,0,0.2);
            color: white;
            font-family: 'Kanit';
            font-size: 0.9rem;
        }

        .btn-action {
            margin-top: auto;
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 18px;
            background: linear-gradient(90deg, var(--primary), var(--accent));
            color: #000;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0, 242, 254, 0.3);
            font-family: 'Kanit';
        }

        /* Scanner Elements */
        .scanner-frame {
            width: 100%;
            height: 280px;
            background: url('https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=400') center/cover;
            border-radius: 30px;
            position: relative;
            overflow: hidden;
            border: 2px solid rgba(0, 242, 254, 0.3);
            margin-top: 20px;
        }
        .laser-bar {
            position: absolute;
            width: 100%;
            height: 3px;
            background: var(--primary);
            box-shadow: 0 0 20px var(--primary);
            animation: move-bar 2s infinite ease-in-out;
        }
        @keyframes move-bar {
            0%, 100% { top: 0; }
            50% { top: 100%; }
        }

        .progress-track {
            width: 100%; height: 6px; background: rgba(255,255,255,0.1);
            border-radius: 10px; margin-top: 40px; overflow: hidden;
        }
        .progress-fill {
            width: 0%; height: 100%; background: var(--primary);
            box-shadow: 0 0 10px var(--primary);
            transition: width 2.5s ease-in-out;
        }

        /* Result Elements */
        .badge {
            background: rgba(0, 255, 136, 0.15);
            color: #00ff88;
            padding: 6px 15px;
            border-radius: 20px;
            font-size: 0.8rem;
            margin-bottom: 20px;
        }
        .profile-pic {
            width: 100px; height: 100px; border-radius: 50%;
            border: 2px solid var(--primary); padding: 5px; margin-bottom: 15px;
        }
        .info-row {
            display: flex; justify-content: space-between; width: 100%;
            padding: 12px 0; border-bottom: 1px solid rgba(255,255,255,0.05);
            font-size: 0.85rem;
        }
        .info-row span:first-child { opacity: 0.5; }
        .info-row span:last-child { color: var(--primary); }
    </style>
</head>
<body>

    <div class="unified-block">
        
        <div class="phase active" id="phase1">
            <h2 style="font-weight: 400; margin-bottom: 10px; color: var(--primary);">FaceID Register</h2>
            <p style="font-size: 0.8rem; opacity: 0.6; margin-bottom: 30px; text-align: center;">กรุณากรอกข้อมูลเพื่อลงทะเบียนเข้าสู่ระบบ</p>
            
            <input type="text" id="fname" placeholder="ชื่อ">
            <input type="text" id="lname" placeholder="นามสกุล">
            <input type="text" id="pos" placeholder="ตำแหน่ง">
            
            <button class="btn-action" onclick="handleRegister()">เริ่มสแกนและบันทึก</button>
        </div>

        <div class="phase" id="phase2">
            <div class="scanner-frame">
                <div class="laser-bar"></div>
            </div>
            <div class="progress-track">
                <div class="progress-fill" id="p-fill"></div>
            </div>
            <div style="display: flex; justify-content: space-between; width: 100%; margin-top: 10px; font-size: 0.8rem;">
                <span id="status-text">Scanning...</span>
                <span id="percent-text">0%</span>
            </div>
        </div>

        <div class="phase" id="phase3">
            <div class="badge">● ID CONFIRMED</div>
            <img src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=200" class="profile-pic">
            <h3 id="display-name" style="font-weight: 400;">-</h3>
            <p id="display-pos" style="font-size: 0.8rem; color: var(--primary); margin-top: 5px;">-</p>

            <div style="width: 100%; margin-top: 30px;">
                <div class="info-row"><span>รหัส ID</span><span id="display-id">กำลังเจนรหัส...</span></div>
                <div class="info-row"><span>สถานะ</span><span>บันทึกสำเร็จ</span></div>
            </div>
            
            <button class="btn-action" onclick="location.reload()">ลงทะเบียนใหม่</button>
        </div>

    </div>

    <script>
    // *** วาง URL ของคุณที่นี่ ***
    const scriptURL = 'https://script.google.com/macros/s/AKfycbx984GFuYq5VzfXFsiW1JSk6kXWfS1PnfYllOtNnN8Q4q6AJ4vhqL6fnHhWlgzDU8x0UQ/exec'; 

    async function handleRegister() {
        const firstName = document.getElementById('fname').value;
        const lastName = document.getElementById('lname').value;
        const position = document.getElementById('pos').value;

        if(!firstName || !lastName || !position) {
            alert('กรุณากรอกข้อมูลให้ครบ'); return;
        }

        // แสดงหน้าสแกน
        document.getElementById('phase1').classList.remove('active');
        document.getElementById('phase2').classList.add('active');

        // แอนิเมชั่นหลอดโหลด
        let count = 0;
        let progressInterval = setInterval(() => {
            count++;
            document.getElementById('p-fill').style.width = count + '%';
            document.getElementById('percent-text').innerText = count + '%';
            if(count >= 100) clearInterval(progressInterval);
        }, 30);

        try {
            // ส่งข้อมูลแบบประนีประนอมกับ Browser (mode: no-cors)
            await fetch(scriptURL, {
                method: 'POST',
                mode: 'no-cors', // แก้ปัญหาการบล็อกข้ามโดเมน
                cache: 'no-cache',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ firstName, lastName, position })
            });

            // เนื่องจากใช้ no-cors เราจะไม่ได้ค่าตอบกลับ (ID) 
            // เราจึงสร้าง ID จำลองขึ้นมาแสดงหน้าจอแทน เพื่อให้ User รู้สึกว่าสำเร็จ
            const mockID = "ID-" + Math.floor(Math.random() * 9000 + 1000);
            
            setTimeout(() => {
                showResult(mockID, { firstName, lastName, position });
            }, 3500);

        } catch (error) {
            console.error('Error!', error);
            alert('ระบบขัดข้อง โปรดตรวจสอบการเชื่อมต่อ');
        }
    }

    function showResult(id, data) {
        document.getElementById('phase2').classList.remove('active');
        document.getElementById('phase3').classList.add('active');
        document.getElementById('display-name').innerText = data.firstName + ' ' + data.lastName;
        document.getElementById('display-pos').innerText = 'ตำแหน่ง: ' + data.position;
        document.getElementById('display-id').innerText = id;
    }
</script>
