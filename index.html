<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI FaceID System</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
    <style>
        :root { --primary: #00f2fe; --accent: #4facfe; --bg: #050a18; --card: rgba(255, 255, 255, 0.05); }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Kanit', sans-serif; }
        body { background: var(--bg); color: #fff; min-height: 100vh; overflow: hidden; }

        .app-view { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; }
        .app-container { width: 350px; height: 600px; background: var(--card); backdrop-filter: blur(20px); border-radius: 35px; padding: 30px; border: 1px solid rgba(255,255,255,0.1); box-shadow: 0 25px 50px rgba(0,0,0,0.5); display: flex; flex-direction: column; justify-content: center; align-items: center; }

        .phase { display: none; flex-direction: column; align-items: center; justify-content: center; width: 100%; height: 100%; }
        .phase.active { display: flex; }
        
        .scanner-view { width: 100%; height: 260px; border-radius: 20px; overflow: hidden; position: relative; background: #000; border: 2px solid var(--primary); margin: 20px 0; }
        .scanner-view.detected { border-color: #00ff88; box-shadow: 0 0 15px rgba(0,255,136,0.3); }
        video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
        canvas { position: absolute; top: 0; left: 0; transform: scaleX(-1); pointer-events: none; }
        .laser { position: absolute; width: 100%; height: 2px; background: var(--primary); animation: scan 2s infinite ease-in-out; }
        @keyframes scan { 0%, 100% { top: 0%; } 50% { top: 100%; } }
        
        input { width: 100%; padding: 12px; margin-bottom: 10px; border-radius: 10px; border: 1px solid #333; background: #000; color: #fff; }
        .btn-main { width: 100%; padding: 15px; border: none; border-radius: 15px; background: var(--primary); color: #000; font-weight: bold; cursor: pointer; transition: 0.3s; margin-top: 20px; }
        .btn-main:disabled { background: #444; color: #888; cursor: not-allowed; }
        .btn-sub { width: 100%; padding: 10px; background: none; color: #aaa; border: none; margin-top: 10px; cursor: pointer; }

        #admin-panel { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg); z-index: 1000; }
        .sidebar { width: 240px; background: rgba(0,0,0,0.4); border-right: 1px solid rgba(255,255,255,0.1); display: flex; flex-direction: column; padding: 25px; }
        .sidebar h2 { color: var(--primary); margin-bottom: 30px; }
        .menu-item { padding: 12px 15px; border-radius: 10px; cursor: pointer; margin-bottom: 8px; color: #ccc; }
        .menu-item:hover, .menu-item.active { background: var(--card); color: var(--primary); }
        .main-content { flex: 1; padding: 30px; overflow-y: auto; display: flex; flex-direction: column; }
        .table-container { background: var(--card); border-radius: 15px; border: 1px solid rgba(255,255,255,0.1); overflow: hidden; margin-top: 20px; }
        table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
        th, td { padding: 12px 15px; text-align: left; border-bottom: 1px solid rgba(255,255,255,0.05); }
        th { color: var(--primary); background: rgba(255,255,255,0.02); }

        .admin-float { position: fixed; bottom: 20px; right: 20px; width: 50px; height: 50px; background: var(--primary); border-radius: 50%; display: flex; justify-content: center; align-items: center; cursor: pointer; color: #000; font-size: 22px; z-index: 500; }
        
        /* สไตล์ไอคอนความสำเร็จ/แจ้งเตือน */
        .status-icon { font-size: 60px; margin-bottom: 15px; }
    </style>
</head>
<body>

    <div class="app-view" id="app-view">
        <div class="app-container">
            <div class="phase active" id="phase1">
                <h2 style="color:var(--primary); text-align: center;">สแกนใบหน้า</h2>
                <div class="scanner-view" id="wrapper1"><video id="vid1" autoplay muted playsinline></video><div class="laser"></div></div>
                <p id="stat1" style="font-size:0.85rem; text-align:center;">กำลังค้นหาใบหน้า...</p>
                <button class="btn-main" id="btn1" onclick="doAction('checkin')" disabled>ลงเวลาทำงาน</button>
                <button class="btn-sub" onclick="setPhase(2)">ลงทะเบียนพนักงานใหม่</button>
            </div>

            <div class="phase" id="phase2">
                <h2 style="color:var(--primary); margin-bottom:20px;">ข้อมูลพนักงาน</h2>
                <input type="text" id="reg-f" placeholder="ชื่อจริง">
                <input type="text" id="reg-l" placeholder="นามสกุล">
                <input type="text" id="reg-p" placeholder="ตำแหน่ง">
                <button class="btn-main" onclick="setPhase(3)">ถัดไป: สแกนหน้า</button>
                <button class="btn-sub" onclick="setPhase(1)">กลับหน้าแรก</button>
            </div>

            <div class="phase" id="phase3">
                <h2 style="color:var(--primary);">บันทึกใบหน้า</h2>
                <div class="scanner-view" id="wrapper3"><video id="vid3" autoplay muted playsinline></video><div class="laser"></div></div>
                <p id="stat3" style="text-align:center;">กรุณานิ่งสักครู่...</p>
                <button class="btn-main" id="btn3" onclick="doAction('register')" disabled>ยืนยันการลงทะเบียน</button>
            </div>

            <div class="phase" id="phase4">
                <div id="res-icon" class="status-icon">⏳</div>
                <p id="res-msg" style="text-align:center; padding:10px; font-size: 1.1rem; font-weight: bold;"></p>
                <p id="res-sub" style="text-align:center; color: #aaa; margin-bottom: 20px;"></p>
                <button class="btn-main" onclick="setPhase(1)">ตกลง</button>
            </div>
        </div>
    </div>

    <div class="admin-float" onclick="openAdmin()">📊</div>

    <div id="admin-panel">
        <div style="display:flex; height:100%;">
            <div class="sidebar">
                <h2>Admin</h2>
                <div class="menu-item active" id="m-report" onclick="switchTab('tab-report')">📋 รายงานลงเวลา</div>
                <div class="menu-item" id="m-emp" onclick="switchTab('tab-emp')">👥 รายชื่อพนักงาน</div>
                <div class="menu-item" style="margin-top:auto; color: #ff4d4d;" onclick="closeAdmin()">🚪 กลับหน้าสแกน</div>
            </div>
            <div class="main-content">
                <div id="tab-report" class="tab-content" style="display:block;">
                    <div style="display:flex; justify-content:space-between; align-items:center;">
                        <h3>รายงานการลงเวลา</h3>
                        <button onclick="exportExcel('logTable')" style="padding:8px 15px; background:#00ff88; border:none; border-radius:8px; font-weight:bold; cursor:pointer;">Excel</button>
                    </div>
                    <div class="table-container">
                        <table id="logTable">
                            <thead><tr><th>วันที่</th><th>ID</th><th>ชื่อ-นามสกุล</th><th>เข้า</th><th>ออก</th><th>สถานะ</th></tr></thead>
                            <tbody id="logBody"></tbody>
                        </table>
                    </div>
                </div>
                <div id="tab-emp" class="tab-content" style="display:none;">
                    <h3>รายชื่อพนักงาน</h3>
                    <div class="table-container">
                        <table id="empTable">
                            <thead><tr><th>ID</th><th>ชื่อ</th><th>นามสกุล</th><th>ตำแหน่ง</th></tr></thead>
                            <tbody id="empBody"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script>
        // ⚠️ แก้ไข URL นี้ให้เป็น URL ล่าสุดจากการ Deploy (Anyone)
        const scriptURL = 'https://script.google.com/macros/s/AKfycbzLaloHOxSs3Hdc_l_ualOEv-APDGO4k0YvnNiep70V7evjwD1FaZEdIYPFA5jgxobILg/exec'; 
        let currentDesc = null;
        let detectInt = null;

        async function initAI() {
            const MODEL_URL = 'https://raw.githubusercontent.com/justadudewhohacks/face-api.js/master/weights';
            try {
                await faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL);
                await faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL);
                await faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL);
                startCam(1);
            } catch (e) { alert("โหลด AI ไม่สำเร็จ"); }
        }

        async function startCam(p) {
            const vid = document.getElementById('vid'+p);
            const wrap = document.getElementById('wrapper'+p);
            const btn = document.getElementById('btn'+p);
            const stat = document.getElementById('stat'+p);

            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 480 } });
                vid.srcObject = stream;
                vid.onplay = () => {
                    const canvas = faceapi.createCanvasFromMedia(vid);
                    wrap.append(canvas);
                    const displaySize = { width: vid.offsetWidth, height: vid.offsetHeight };
                    faceapi.matchDimensions(canvas, displaySize);

                    detectInt = setInterval(async () => {
                        const det = await faceapi.detectSingleFace(vid, new faceapi.TinyFaceDetectorOptions()).withFaceLandmarks().withFaceDescriptor();
                        const ctx = canvas.getContext('2d');
                        ctx.clearRect(0, 0, canvas.width, canvas.height);

                        if (det) {
                            currentDesc = Array.from(det.descriptor);
                            wrap.classList.add('detected');
                            btn.disabled = false;
                            stat.innerText = "พบใบหน้าแล้ว!";
                            stat.style.color = "#00ff88";
                        } else {
                            wrap.classList.remove('detected');
                            btn.disabled = true;
                            stat.innerText = "กำลังค้นหาใบหน้า...";
                            stat.style.color = "#ccc";
                        }
                    }, 400);
                };
            } catch (e) { console.log(e); }
        }

        function setPhase(n) {
            clearInterval(detectInt);
            document.querySelectorAll('.phase').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('video').forEach(v => { if(v.srcObject) v.srcObject.getTracks().forEach(t => t.stop()); });
            document.querySelectorAll('canvas').forEach(c => c.remove());
            document.getElementById('phase'+n).classList.add('active');
            if(n==1 || n==3) startCam(n);
        }

async function doAction(act) {
    const payload = {
        action: act,
        faceDescriptor: currentDesc,
        firstName: document.getElementById('reg-f').value,
        lastName: document.getElementById('reg-l').value,
        position: document.getElementById('reg-p').value
    };

    // แสดงหน้าโหลดข้อมูล
    document.getElementById('res-msg').innerText = "กำลังประมวลผล...";
    setPhase(4);

    try {
        // 1. นำ mode: 'no-cors' ออก (สำคัญมาก!) เพื่อให้ Browser ยอมให้อ่านคำตอบจาก Server
        const response = await fetch(scriptURL, { 
            method: 'POST', 
            body: JSON.stringify(payload) 
        });

        // 2. อ่านข้อความที่ส่งมาจาก ContentService.createTextOutput ใน Google Script
        const resultText = await response.text();

        // 3. แสดงข้อความแจ้งเตือนที่ส่งมาจาก Code.gs บนหน้าจอ
        document.getElementById('res-msg').innerText = resultText;

    } catch (e) {
        document.getElementById('res-msg').innerText = "การเชื่อมต่อขัดข้อง: " + e;
    }
}

        function openAdmin() {
            if (prompt("รหัสผ่าน:") === "1234") {
                document.getElementById('admin-panel').style.display = 'block';
                document.getElementById('app-view').style.display = 'none';
                fetchData();
            }
        }

        function closeAdmin() {
            document.getElementById('admin-panel').style.display = 'none';
            document.getElementById('app-view').style.display = 'flex';
            setPhase(1);
        }

        function switchTab(id) {
            document.querySelectorAll('.tab-content').forEach(t => t.style.display = 'none');
            document.querySelectorAll('.menu-item').forEach(m => m.classList.remove('active'));
            document.getElementById(id).style.display = 'block';
            document.getElementById('m-' + id.split('-')[1]).classList.add('active');
        }

        async function fetchData() {
            try {
                const logRes = await fetch(scriptURL + "?action=getLogs");
                const logs = await logRes.json();
                document.getElementById('logBody').innerHTML = logs.reverse().map(r => `<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]} ${r[3]}</td><td>${r[4]}</td><td>${r[5]}</td><td>${r[6]}</td></tr>`).join('');

                const empRes = await fetch(scriptURL + "?action=getEmployees");
                const emps = await empRes.json();
                document.getElementById('empBody').innerHTML = emps.map(r => `<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td><td>${r[3]}</td></tr>`).join('');
            } catch (e) { console.log("Fetch Error", e); }
        }

        function exportExcel(id) { XLSX.writeFile(XLSX.utils.table_to_book(document.getElementById(id)), "Attendance_Report.xlsx"); }

        initAI();
    </script>
</body>
</html>
