<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>AI FaceID System</title>
    <script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #00f2fe; --bg: #050a18; }
        body { background: var(--bg); color: white; font-family: 'Kanit', sans-serif; margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .app-container { width: 350px; background: rgba(255,255,255,0.05); padding: 30px; border-radius: 35px; border: 1px solid rgba(255,255,255,0.1); text-align: center; }
        .scanner-view { width: 100%; height: 320px; background: #000; border-radius: 20px; position: relative; overflow: hidden; margin: 20px 0; border: 2px solid var(--primary); }
        video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
        .face-frame { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; pointer-events: none; }
        .phase { display: none; flex-direction: column; }
        .active { display: flex; }
        .btn-main { width: 100%; padding: 15px; background: var(--primary); color: #000; border: none; border-radius: 12px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .btn-main:disabled { background: #444; color: #888; }
        input { width: 100%; padding: 12px; margin-bottom: 10px; border-radius: 10px; border: 1px solid #333; background: #000; color: #fff; }
    </style>
</head>
<body>
    <div class="app-container">
        <div id="phase1" class="phase active">
            <h2 style="color:var(--primary)">ลงเวลาทำงาน</h2>
            <div class="scanner-view">
                <video id="vid1" autoplay muted playsinline></video>
                <svg class="face-frame" viewBox="0 0 100 100" preserveAspectRatio="none">
                    <ellipse cx="50" cy="50" rx="35" ry="40" style="fill:none; stroke:var(--primary); stroke-width:0.6; stroke-dasharray:3 3;" />
                    <line x1="15" y1="50" x2="85" y2="50" style="stroke:var(--primary); stroke-width:0.6; stroke-dasharray:3 3;" />
                </svg>
            </div>
            <p id="stat1">กำลังโหลด AI...</p>
            <button id="btn1" class="btn-main" onclick="doAction('checkin')" disabled>สแกนลงเวลา</button>
            <button style="background:none; color:#aaa; border:none; margin-top:10px; cursor:pointer;" onclick="setPhase(2)">ลงทะเบียนพนักงานใหม่</button>
        </div>

        <div id="phase2" class="phase">
            <h2 style="color:var(--primary)">ข้อมูลพนักงาน</h2>
            <input type="text" id="reg-f" placeholder="ชื่อจริง">
            <input type="text" id="reg-l" placeholder="นามสกุล">
            <input type="text" id="reg-p" placeholder="ตำแหน่ง">
            <button class="btn-main" onclick="setPhase(3)">ไปหน้าสแกนใบหน้า</button>
            <button style="background:none; color:#aaa; border:none; margin-top:10px; cursor:pointer;" onclick="setPhase(1)">ยกเลิก</button>
        </div>

        <div id="phase3" class="phase">
            <h2 style="color:var(--primary)">บันทึกใบหน้า</h2>
            <div class="scanner-view">
                <video id="vid3" autoplay muted playsinline></video>
                <svg class="face-frame" viewBox="0 0 100 100" preserveAspectRatio="none">
                    <ellipse cx="50" cy="50" rx="35" ry="40" style="fill:none; stroke:var(--primary); stroke-width:0.6; stroke-dasharray:3 3;" />
                </svg>
            </div>
            <p id="stat3">กรุณาวางหน้าในกรอบ</p>
            <button id="btn3" class="btn-main" onclick="doAction('register')" disabled>บันทึกพนักงาน</button>
        </div>
    </div>

    <script>
        const scriptURL = 'https://script.google.com/macros/s/AKfycbx0AIb7i1dwD87yxNiSJuchGP2j5w2E-fRKPe6Z3ENN4BvuLo6NbpM9PtLuHlDoyDJ94Q/exec'; 
        let currentDesc = null;
        let detectInt = null;

        async function initAI() {
            const MODEL_URL = 'https://raw.githubusercontent.com/justadudewhohacks/face-api.js/master/weights';
            await faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL);
            await faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL); // แก้บั๊กสแกน
            await faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL);
            startCam(1);
        }

        async function startCam(p) {
            const vid = document.getElementById('vid' + p);
            const btn = document.getElementById('btn' + p);
            const stat = document.getElementById('stat' + p);
            const stream = await navigator.mediaDevices.getUserMedia({ video: true });
            vid.srcObject = stream;
            vid.onplay = () => {
                detectInt = setInterval(async () => {
                    const det = await faceapi.detectSingleFace(vid, new faceapi.TinyFaceDetectorOptions()).withFaceLandmarks().withFaceDescriptor();
                    if (det) {
                        currentDesc = Array.from(det.descriptor);
                        btn.disabled = false;
                        stat.innerText = "พบใบหน้า - พร้อมบันทึก";
                        stat.style.color = "#00ff88";
                    } else {
                        btn.disabled = true;
                        stat.innerText = "กรุณาวางหน้าในกรอบ";
                        stat.style.color = "white";
                    }
                }, 400);
            };
        }

        function setPhase(n) {
            clearInterval(detectInt);
            document.querySelectorAll('.phase').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('video').forEach(v => { if(v.srcObject) v.srcObject.getTracks().forEach(t => t.stop()); });
            document.getElementById('phase' + n).classList.add('active');
            if(n==1 || n==3) startCam(n);
        }

        async function doAction(act) {
            const payload = { 
                action: act, faceDescriptor: currentDesc,
                firstName: document.getElementById('reg-f').value,
                lastName: document.getElementById('reg-l').value,
                position: document.getElementById('reg-p').value
            };
            await fetch(scriptURL, { method: 'POST', body: JSON.stringify(payload) });
            alert("บันทึกข้อมูลเรียบร้อย!");
            location.reload();
        }

        initAI();
    </script>
</body>
</html>
