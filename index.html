<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI FaceID Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
    <style>
        :root { --primary: #00f2fe; --accent: #4facfe; --bg: #050a18; --card: rgba(255,255,255,0.05); }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Kanit', sans-serif; }
        body { background: var(--bg); color: #fff; overflow-x: hidden; }

        /* Dashboard Layout */
        #admin-panel { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg); z-index: 1000; display: flex; }
        
        /* Sidebar */
        .sidebar { width: 240px; background: rgba(0,0,0,0.3); border-right: 1px solid rgba(255,255,255,0.1); display: flex; flex-direction: column; padding: 20px; }
        .sidebar h2 { color: var(--primary); margin-bottom: 30px; font-size: 1.2rem; }
        .menu-item { padding: 12px 15px; border-radius: 10px; cursor: pointer; transition: 0.3s; margin-bottom: 5px; opacity: 0.7; }
        .menu-item:hover, .menu-item.active { background: var(--card); opacity: 1; color: var(--primary); }
        
        /* Main Content */
        .main-content { flex: 1; padding: 30px; overflow-y: auto; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        /* Tables */
        .table-container { background: var(--card); border-radius: 20px; border: 1px solid rgba(255,255,255,0.1); overflow: hidden; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 15px; text-align: left; border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 0.9rem; }
        th { background: rgba(255,255,255,0.02); color: var(--primary); }
        
        /* Floating Button */
        .admin-float { position: fixed; bottom: 20px; right: 20px; width: 50px; height: 50px; background: var(--primary); color: #000; border-radius: 50%; display: flex; justify-content: center; align-items: center; cursor: pointer; z-index: 500; font-size: 24px; box-shadow: 0 10px 20px rgba(0,242,254,0.3); }
        
        /* App Container (Original) */
        .app-container { width: 360px; height: 680px; background: var(--card); backdrop-filter: blur(20px); border-radius: 40px; padding: 30px; margin: 50px auto; border: 1px solid rgba(255,255,255,0.1); display: flex; flex-direction: column; }
        .phase { display: none; flex-direction: column; align-items: center; }
        .phase.active { display: flex; }
    </style>
</head>
<body>

    <div class="app-container" id="app-view">
        <div class="phase active" id="phase1">
            <h2 style="color:var(--primary)">สแกนเข้างาน</h2>
            <button class="btn-main" onclick="openAdmin()" style="margin-top: 20px; background: none; color: var(--primary); border: 1px solid; padding: 10px; border-radius: 10px; cursor: pointer;">เปิด Dashboard</button>
        </div>
    </div>

    <div id="admin-panel" style="display:none;">
        <div class="sidebar">
            <h2>Admin Panel</h2>
            <div class="menu-item active" onclick="switchTab('tab-report')">📋 รายงานลงเวลา</div>
            <div class="menu-item" onclick="switchTab('tab-emp')">👥 รายชื่อพนักงาน</div>
            <div class="menu-item" onclick="location.reload()" style="margin-top: auto; color: #ff4d4d;">🚪 ออกจากระบบ</div>
        </div>

        <div class="main-content">
            <div id="tab-report" class="tab-content active">
                <div class="header">
                    <h3>รายงานการลงเวลา</h3>
                    <div>
                        <button onclick="exportExcel('logTable')" style="padding: 8px 15px; background: #00ff88; color: #000; border: none; border-radius: 8px; cursor: pointer; font-weight: bold;">Export Excel</button>
                    </div>
                </div>
                <div class="table-container">
                    <table id="logTable">
                        <thead><tr><th>วันที่</th><th>ID</th><th>ชื่อ-นามสกุล</th><th>เข้า</th><th>ออก</th><th>สถานะ</th></tr></thead>
                        <tbody id="logBody"></tbody>
                    </table>
                </div>
            </div>

            <div id="tab-emp" class="tab-content">
                <div class="header">
                    <h3>รายชื่อพนักงานทั้งหมด</h3>
                </div>
                <div class="table-container">
                    <table id="empTable">
                        <thead><tr><th>ID</th><th>ชื่อ</th><th>นามสกุล</th><th>ตำแหน่ง</th></tr></thead>
                        <tbody id="empBody"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script>
        const scriptURL = 'https://script.google.com/macros/s/AKfycbyAsGoU9_k02MBIPjXZxYAFz9nNJgt3NRQPGRf5orn6xGnLBKwTJ96GtEx9Hx1RIiGS7g/exec';

        function openAdmin() {
            if (prompt("รหัสผ่าน Admin:") === "1234") {
                document.getElementById('admin-panel').style.display = 'flex';
                document.getElementById('app-view').style.display = 'none';
                fetchData();
            }
        }

        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.menu-item').forEach(m => m.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            event.currentTarget.classList.add('active');
        }

        async function fetchData() {
            // ดึงรายงานลงเวลา
            const logRes = await fetch(scriptURL + "?action=getLogs");
            const logData = await logRes.json();
            const logBody = document.getElementById('logBody');
            logBody.innerHTML = logData.reverse().map(row => `
                <tr><td>${row[0]}</td><td>${row[1]}</td><td>${row[2]} ${row[3]}</td><td>${row[4]}</td><td>${row[5]}</td><td>${row[6]}</td></tr>
            `).join('');

            // ดึงรายชื่อพนักงาน
            const empRes = await fetch(scriptURL + "?action=getEmployees");
            const empData = await empRes.json();
            const empBody = document.getElementById('empBody');
            empBody.innerHTML = empData.map(row => `
                <tr><td>${row[0]}</td><td>${row[1]}</td><td>${row[2]}</td><td>${row[3]}</td></tr>
            `).join('');
        }

        function exportExcel(tableId) {
            XLSX.writeFile(XLSX.utils.table_to_book(document.getElementById(tableId)), "Report.xlsx");
        }
    </script>
</body>
</html>
